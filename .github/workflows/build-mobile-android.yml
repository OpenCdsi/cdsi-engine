# Builds the OpenCdsi.VaxEngine.Mobile .NET MAUI app for Android.
#
# This can't be validated locally in every dev environment: building for Android needs the real
# Android SDK (platform android.jar, build-tools) that .NET's own workload install pulls from
# Google's package repository at build time, not from NuGet - environments that restrict egress
# to dl.google.com (as some sandboxed/agent environments do) can restore and compile the project
# but can't get past resource linking. A GitHub-hosted runner has unrestricted internet, so this
# workflow is the actual place the Android build gets exercised end to end.

name: Build OpenCdsi.VaxEngine.Mobile (Android)

on:
  push:
    branches: [main]
    paths:
      - 'src/OpenCdsi.VaxEngine.Mobile/**'
      - 'src/OpenCdsi.VaxEngine.Core/**'
      - '.github/workflows/build-mobile-android.yml'
  pull_request:
    paths:
      - 'src/OpenCdsi.VaxEngine.Mobile/**'
      - 'src/OpenCdsi.VaxEngine.Core/**'
      - '.github/workflows/build-mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore src/OpenCdsi.VaxEngine.Mobile/OpenCdsi.VaxEngine.Mobile.csproj

      - name: Build (Release, Android)
        run: >
          dotnet build src/OpenCdsi.VaxEngine.Mobile/OpenCdsi.VaxEngine.Mobile.csproj
          -c Release
          -f net10.0-android
          --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vaxengine-mobile-android
          path: src/OpenCdsi.VaxEngine.Mobile/bin/Release/net10.0-android/**/*-Signed.apk
          if-no-files-found: error
